[workspace]
members = ["crates/*", "testing"]
resolver = "3"

[workspace.dependencies]
# Internal
conclave-client = { path = "crates/client", version = "0.0", default-features = false }
conclave-common = { path = "crates/common", version = "0.0", default-features = false }
conclave-server = { path = "crates/server", version = "0.0", default-features = false }
conclave-tracker = { path = "crates/tracker", version = "0.0", default-features = false }

# External
anyhow = { version = "1.0", default-features = false }
arboard = { version = "3.6.1", default-features = false }
argon2 = { version = "0.5.3", default-features = false }
async-sqlite = { version = "0.6.0", default-features = false }
base64 = { version = "0.23.1", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.6", default-features = false }
dashmap = { version = "6.1.0", default-features = false }
dialoguer = { version = "0.12.0", default-features = false }
domain = { version = "0.12.2", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
eframe = { version = "0.36.1", default-features = false }
futures = { version = "0.3.34", default-features = false }
hex = { version = "0.4.3", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
home = { version = "0.5.12", default-features = false }
image = { version = "0.25.10", default-features = false }
mdns-sd = { version = "0.21.0", default-features = false }
pqcrypto-mldsa = { version = "0.1.2", default-features = false }
pqcrypto-mlkem = { version = "0.1.1", default-features = false }
pqcrypto-traits = { version = "0.3.5", default-features = false }
postcard = { version = "1.1.3", default-features = false }
rfd = { version = "0.17.2" }
semver = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false }
tempdir = { version = "0.3.7", default-features = false }
tokio = { version = "1.53.1", default-features = false }
toml = { version = "1.1.4", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
uuid = { version = "1.24.0", default-features = false }
wgpu = { version = "30", default-features = false } # Needs to be the same version used by egui
zeroize = { version = "1.9.0", default-features = false }

[workspace.package]
authors = ["Richard Zak <richard.j.zak@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/rjzak/conclave"
rust-version = "1.95.0"
version = "0.0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
